# pdf2epub 项目配置
# 注意:API Key / Token 等凭证一律使用环境变量,不得写入本文件。

# 默认 PDF 解析后端: pymupdf(电子版) | mineru(云端 OCR) | paddleocr(Phase 5)
ocr_backend: mineru

# MinerU Cloud 参数(凭证:环境变量 MINERU_API_TOKEN)
mineru:
  model_version: vlm        # pipeline | vlm(推荐) | MinerU-HTML
  is_ocr: true              # 扫描版必须开启 OCR
  enable_formula: true
  enable_table: true
  language: ch
  max_pages_per_task: 200   # 官方单任务页数上限;超过自动按 page_ranges 分片提交并合并
  resume: true              # 中断(超时/关窗口)后复用已提交的云端任务,不重新上传

# Markdown 清理项开关(CLI --clean-disable 可在单次运行中关闭某项;
# 桌面端「清理选项」对应 page_numbers / join_lines / bold / images)
clean:
  page_numbers: true        # 剔除独立页码行
  join_lines: true          # 跨页断行连接
  cjk_spaces: true          # 中文排版空格修正(汉字/中文标点/数字之间的空格)
  bold: false               # 强调字体(楷体/中宋等)→ ** 粗体,标注较密集,默认关
  images: true              # 图片引用存在性校验(缺失会在清理报告中提示)

# 本地 PyMuPDF4LLM
pymupdf:
  write_images: true
  # 强调字体列表:PDF 中用这些字体(如楷体/中宋)排版的文字,
  # 提取后自动标注为 **粗体**(PyMuPDF4LLM 不保留字体信息)
  bold_fonts: ["KaiTi", "STZhongsong", "FZZYSK1--GBK1-0", "FZTYSK--GBK1-0", "FZCYSCK--GBK1-0"]

# PaddleOCR-VL 1.6(凭证:环境变量 PADDLEOCR_TOKEN,百度 AI Studio)
paddleocr:
  use_chart_recognition: false
  use_doc_orientation_classify: false
  use_doc_unwarping: false
  resume: true              # 中断后复用已提交的云端任务,不重新上传
