# pdf2epub 项目配置
# 注意:API Key / Token 等凭证一律使用环境变量,不得写入本文件。

# 默认 PDF 解析后端: pymupdf(电子版) | mineru(云端 OCR) | paddleocr(Phase 5)
ocr_backend: mineru

# MinerU Cloud 参数(凭证:环境变量 MINERU_API_TOKEN)
mineru:
  model_version: vlm        # pipeline | vlm(推荐) | MinerU-HTML
  is_ocr: true              # 扫描版必须开启 OCR
  enable_formula: true
  enable_table: true
  language: ch

# 本地 PyMuPDF4LLM
pymupdf:
  write_images: true

# PaddleOCR-VL 1.6(凭证:环境变量 PADDLEOCR_TOKEN,百度 AI Studio)
paddleocr:
  use_chart_recognition: false
  use_doc_orientation_classify: false
  use_doc_unwarping: false
