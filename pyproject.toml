[project]
name = "pdf2epub"
version = "0.6.1"
description = "PDF → EPUB 电子书转换工具(统一输出高质量 EPUB)"
requires-python = ">=3.12"
dependencies = [
    "pymupdf4llm>=1.28.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
ebook-converter = "pdf2epub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 引擎装进 site-packages/pdf2epub/(独立命名空间)。
# 不要再用 force-include 把 src/ 摊平到 wheel 根:那样 markdown/、epub/、clean/、
# events.py、paths.py 都是通用顶层名,会和 PyPI 的同名包互相覆盖(pip 安装时静默
# 合并目录、卸载时互相删文件),连 site-packages 根上的 __init__.py 都会被写进去。
[tool.hatch.build.targets.wheel]
packages = ["src/pdf2epub"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    # 钉死版本：CI 用 uv run ruff check，不再用浮动的 uvx ruff check
    #（上游发新版规则会让与改动无关的 PR 突然变红）
    "ruff==0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# ---- 静态检查(ratchet)
# 历史代码尚未逐条清理,一次性全量开规则会带来几百处噪音、也容易在无关提交里
# 改动大量历史行。这里先用 `include` 钉住"新增 + 核心"路径:**新代码必须过**,
# 存量按模块逐步并入 include,而不是反过来给存量加一堆 ignore。
[tool.ruff]
target-version = "py312"
line-length = 120
include = [
    "src/pdf2epub/net.py",
    "src/pdf2epub/paths.py",
    "src/pdf2epub/artifacts.py",
    "src/pdf2epub/taskrun.py",
    "src/pdf2epub/backends/*.py",
    "tests/test_mineru_parts.py",
    "tests/test_mineru_http.py",
    "tests/test_mineru_package.py",
    "tests/test_net.py",
    "tests/test_safe_zip.py",
    "tests/test_mineru_zip_guard.py",
    "tests/test_credentials.py",
    "tests/test_artifacts.py",
    "tests/test_taskrun.py",
    "tests/test_error_categories.py",
    "tests/test_console_encoding.py",
    "scripts/ci_scope.py",
    "scripts/ci_install_pandoc.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
