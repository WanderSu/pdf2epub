[project]
name = "pdf2epub"
version = "0.5.5"
description = "PDF → EPUB 电子书转换工具(统一输出高质量 EPUB)"
requires-python = ">=3.12"
dependencies = [
    "pymupdf4llm>=1.28.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
ebook-converter = "pdf2epub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 引擎装进 site-packages/pdf2epub/(独立命名空间)。
# 不要再用 force-include 把 src/ 摊平到 wheel 根:那样 markdown/、epub/、clean/、
# events.py、paths.py 都是通用顶层名,会和 PyPI 的同名包互相覆盖(pip 安装时静默
# 合并目录、卸载时互相删文件),连 site-packages 根上的 __init__.py 都会被写进去。
[tool.hatch.build.targets.wheel]
packages = ["src/pdf2epub"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
